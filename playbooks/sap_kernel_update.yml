---
- name: Update SAP Kernel
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  vars:
        sap_sid: "{{ sap_sid }}"
        sap_instance_number: "{{ sap_instance_number }}"
        sap_kernel_sapexe_sar: "{{ sap_kernel_sapexe_sar }}"
        sap_kernel_sapexedb_sar: "{{ sap_kernel_sapexedb_sar }}"  

  roles: 
    - sap_kernel_update
  tasks: 
    - name: Run Kernel update role
      ansible.builtin.import_role: 
        name: "sap_kernel_update"
  
